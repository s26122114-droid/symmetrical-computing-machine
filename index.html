        /* === 日系粉嫩可愛風格變數 === */
        :root {
            --bg-color: #fce7f3;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --pastel-pink: #f472b6;
            --pastel-purple: #c084fc;
            --pastel-yellow: #fef08a;
            --pastel-blue: #38bdf8;
            --text-main: #701a75;
            --radius-round: 24px;
            --box-shadow: 0 10px 25px rgba(244, 114, 182, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', 'Mochiy Pop P One', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(#fbcfe8 20%, transparent 20%),
                radial-gradient(#e0e7ff 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 12px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Mochiy Pop P One', cursive;
            font-size: 2.2rem;
            color: var(--pastel-pink);
            text-shadow: 3px 3px 0px #ffffff, 5px 5px 0px #fbcfe8;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        header p {
            color: #a21caf;
            font-size: 0.95rem;
            font-weight: bold;
            background: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* === 主卡片響應式佈局 === */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 1000px;
        }

        @media (min-width: 820px) {
            .app-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* === 左側：畫布預覽區 === */
        .preview-card {
            flex: 1.1;
            background: var(--panel-bg);
            border: 4px solid #ffffff;
            border-radius: var(--radius-round);
            padding: 20px;
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .meme-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            background-color: #fff5f8;
            border: 3px dashed #f472b6;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(244, 114, 182, 0.15);
        }

        .meme-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder-text {
            position: absolute;
            color: #db2777;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            line-height: 1.7;
        }

        /* 迷因文字 Overlay (黑邊強效處理) */
        .meme-text {
            position: absolute;
            left: 5%;
            width: 90%;
            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            line-height: 1.25;
            word-break: break-word;
            user-select: none;
            pointer-events: none;
            color: #ffffff;
            text-shadow: 
                -3px -3px 0 #000,  3px -3px 0 #000,
                -3px  3px 0 #000,  3px  3px 0 #000,
                 0px -3px 0 #000,  0px  3px 0 #000,
                -3px  0px 0 #000,  3px  0px 0 #000,
                 0px  4px 10px rgba(0,0,0,0.8);
            transform-origin: center center;
            transition: color 0.1s;
        }

        .meme-text.top {
            top: 5%;
        }

        .meme-text.bottom {
            bottom: 5%;
        }

        /* 悄悄話 (水印/角落備註) */
        .meme-secret {
            position: absolute;
            bottom: 12px;
            right: 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), -1px -1px 3px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
            z-index: 5;
            letter-spacing: 0.5px;
        }
