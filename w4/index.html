<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 🌸</title>
  <!-- Google Fonts: 引入可愛風格的字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       【顏色與主題變數設定】
       方便後續修改整體視覺配色！
       ========================================== */
    :root {
      --bg-color: #fef4f8;           /* 網頁背景色 (溫和粉白) */
      --header-title: #ff6b8b;       /* 標題顏色 (甜美粉紅) */
      --card-bg: #ffffff;            /* 卡片預設背景色 (純白) */
      --card-text: #5a4b51;          /* 內文文字顏色 (深柔灰棕) */
      --card-name: #ff85a1;          /* 名字標籤顏色 (珊瑚粉) */
      --card-time: #b5a3ab;          /* 時間標籤顏色 (淺灰色) */
      
      /* 輪播 Highlight 特效顏色 */
      --highlight-border: #ff477e;   /* 高亮卡片的邊框顏色 */
      --highlight-shadow: rgba(255, 71, 126, 0.4); /* 高亮卡片的發光陰影顏色 */
      
      /* 動畫輪播秒數：請記得同步修改 JavaScript 中的 CAROUSEL_INTERVAL 變數 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
      background-color: var(--bg-color);
      /* 背景可愛點點花紋 */
      background-image: radial-gradient(#ffd1dc 15%, transparent 16%), radial-gradient(#ffe5ec 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--card-text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- 頁首標題區 --- */
    header {
      text-align: center;
      margin: 20px 0 30px 0;
    }

    header h1 {
      color: var(--header-title);
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0px #ffffff, 5px 5px 0px #ffe5ec;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      color: #9c8089;
      font-weight: 500;
    }

    /* --- 載入中動畫區 --- */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
    }

    /* 可愛跳躍粉紅泡泡 */
    .loader-bubbles {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .bubble {
      width: 20px;
      height: 20px;
      background-color: #ff85a1;
      border-radius: 50%;
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    .bubble:nth-child(2) {
      background-color: #f7aef8;
      animation-delay: 0.2s;
    }

    .bubble:nth-child(3) {
      background-color: #b388eb;
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.1); }
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--header-title);
      letter-spacing: 1px;
    }

    /* --- 主要內容區 --- */
    main {
      width: 100%;
      max-width: 1200px;
    }

    /* --- 瀑布流排版 (Masonry Layout) --- */
    .masonry-grid {
      /* RWD 響應式欄位設定：電腦版 3 欄 */
      column-count: 3;
      column-gap: 24px;
    }

    /* 螢幕較小（平板）改為 2 欄 */
    @media (max-width: 900px) {
      .masonry-grid {
        column-count: 2;
      }
    }

    /* 手機版改為 1 欄 */
    @media (max-width: 600px) {
      .masonry-grid {
        column-count: 1;
      }
    }

    /* --- 留言卡片樣式 --- */
    .message-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      /* 防止卡片在瀑布流中被拆斷到不同欄位 */
      break-inside: avoid;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
      border: 3px solid #fff0f5;
      position: relative;
      /* 滑順的渡過動畫（高亮與變暗） */
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    .message-card:hover {
      transform: translateY(-4px);
    }

    /* 可愛卡片可愛貼紙裝飾標籤 */
    .card-badge {
      position: absolute;
      top: -10px;
      right: 15px;
      background: #ffe5ec;
      color: #ff477e;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      border: 2px solid #ffffff;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px dashed #ffe5ec;
      padding-bottom: 8px;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--card-name);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--card-time);
    }

    .card-content {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--card-text);
      white-space: pre-wrap; /* 保留留言中的換行 */
      word-break: break-word;
    }

    /* ==========================================
       【輪播特效：高亮 (Highlight) & 變暗 (Dim)】
       ========================================== */

    /* 被選中的高亮卡片樣式 */
    .message-card.highlight {
      transform: scale(1.08); /* 放大卡片 */
      border-color: var(--highlight-border); /* 鮮豔邊框 */
      box-shadow: 0 12px 30px var(--highlight-shadow); /* 外發光效果 */
      filter: blur(0px) brightness(1.05);
      z-index: 10; /* 確保浮在最上層 */
    }

    /* 其他未被選中的卡片變暗/變模糊樣式 */
    .message-card.dimmed {
      opacity: 0.5; /* 降低透明度 */
      filter: blur(1.5px) grayscale(20%); /* 微模糊與降飽和度 */
      transform: scale(0.96); /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <header>
    <h1>💌 朋友對我的悄悄話留言板 💌</h1>
    <p>✨ 甜甜的回憶與溫馨留言集結地 ✨</p>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading-container">
    <div class="loader-bubbles">
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
    </div>
    <div class="loading-text">讀取留言中... 請稍等一下唷 🌸</div>
  </div>

  <!-- 留言牆區塊 (瀑布流) -->
  <main>
    <div id="wall" class="masonry-grid"></div>
  </main>

  <script>
    // ==========================================
    // 【參數設定區】
    // ==========================================
    
    // 原始 Google 試算表連結轉 CSV 下載網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTtZHd3rvJYAqKTKQvphuvwqfd9BWBq8sEgqiiDmmf7gjr8Ofa7Sl2OBda3R4RfsiW7Wg9HNt2ImGzY/pub?output=csv';

    // 💡 輪播切換秒數設定 (單位：毫秒，3000ms = 3 秒)
    const CAROUSEL_INTERVAL = 3000; 

    // 全域變數
    let messages = [];          // 儲存解析後的留言資料
    let currentHighlightIndex = 0; // 目前高亮的卡片索引
    let carouselTimer = null;   // 計時器物件

    // ==========================================
    // 【CSV 解析函數】
    // 處理欄位包含「逗號 (,)」與「換行」的複雜 CSV 格式
    // ==========================================
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理雙引號轉義 (例如: "")
          if (insideQuotes && nextChar === '"') {
            entry += '"';
            i++; 
          } else {
            // 切換引號狀態
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          // 逗號切換下一個欄位
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          // 換行符號切換下一個橫列
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 \r\n
          }
          row.push(entry.trim());
          if (row.length > 0 && row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }

      // 處理最後一行資料
      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }

      return lines;
    }

    // ==========================================
    // 【獲取與處理資料】
    // ==========================================
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('無法讀取試算表資料');

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 排除標題列 (第一行: 時間戳記, 名字, 悄悄話)，處理實際留言內容
        const dataRows = parsedData.slice(1);

        messages = dataRows.map(row => ({
          timestamp: row[0] || '未知時間',
          name: row[1] || '匿名好朋友',
          content: row[2] || '這是一則空白悄悄話～'
        }));

        // 隱藏讀取動畫，生成留言卡片牆
        document.getElementById('loading-container').style.display = 'none';
        renderWall(messages);

        // 如果有資料，開啟隨時間輪播特效
        if (messages.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('讀取失敗:', error);
        document.getElementById('loading-container').innerHTML = `
          <div class="loading-text" style="color: #ff4d4d;">❌ 留言讀取失敗，請稍後再試！</div>
        `;
      }
    }

    // ==========================================
    // 【動態生成 HTML 卡片】
    // ==========================================
    function renderWall(data) {
      const wallContainer = document.getElementById('wall');
      wallContainer.innerHTML = ''; // 清空內容

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.dataset.index = index;

        // 格式化顯示時間（簡化日期呈現）
        let formattedTime = item.timestamp;
        if(item.timestamp.includes(' ')) {
          formattedTime = item.timestamp.split(' ')[0]; // 只保留日期部分
        }

        card.innerHTML = `
          <div class="card-badge"># ${index + 1}</div>
          <div class="card-header">
            <div class="card-name">🌸 ${escapeHTML(item.name)}</div>
            <div class="card-time">${escapeHTML(formattedTime)}</div>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        // 點擊卡片時，可手動將焦點切換到該卡片
        card.addEventListener('click', () => {
          highlightCard(index);
          resetCarousel(); // 重置輪播計時器
        });

        wallContainer.appendChild(card);
      });
    }

    // XSS 防護處理函數
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================
    // 【隨時間輪播特效 (Highlight)】
    // ==========================================
    function highlightCard(index) {
      const cards = document.querySelectorAll('.message-card');
      if (cards.length === 0) return;

      cards.forEach((card, i) => {
        if (i === index) {
          // 當前選中的卡片：加上高亮樣式，移除變暗樣式
          card.classList.add('highlight');
          card.classList.remove('dimmed');
        } else {
          // 其他未選中卡片：加上變暗樣式，移除高亮樣式
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });

      currentHighlightIndex = index;
    }

    // 自動切換下一張卡片
    function nextHighlight() {
      if (messages.length === 0) return;
      const nextIndex = (currentHighlightIndex + 1) % messages.length;
      highlightCard(nextIndex);
    }

    // 開啟計時器
    function startCarousel() {
      // 預設先亮起第一張
      highlightCard(0);
      
      // 設定固定間隔時間執行
      carouselTimer = setInterval(nextHighlight, CAROUSEL_INTERVAL);
    }

    // 手點擊卡片後重置計時器，避免剛手動點擊完又立刻被自動切換
    function resetCarousel() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
      }
      carouselTimer = setInterval(nextHighlight, CAROUSEL_INTERVAL);
    }

    // 網頁載入後自動開始執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
