<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端心電感應｜Cloud Telepathy</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            morandi: {
              bg: '#F7F6F3',        // Notion 暖米白底色
              card: '#FFFFFF',      // 純白卡片
              border: '#E6E4DF',    // 細緻灰邊框
              text: '#37352F',      // Notion 深炭灰文字
              muted: '#787774',     // 次要說明文字
              blue: '#8FA3B0',      // 莫蘭迪霧霾藍
              blueDark: '#738998',
              sage: '#9CAF9E',      // 莫蘭迪鼠尾草綠
              sageDark: '#7F9682',
              rose: '#C59B9B',      // 莫蘭迪乾燥玫瑰
              roseDark: '#AD7F7F',
              sand: '#D6C7B2',      // 莫蘭迪燕麥沙
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F7F6F3;
      color: #37352F;
      -webkit-font-smoothing: antialiased;
    }

    /* 3D 翻牌核心 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .flip-card.is-flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* Notion 風格微動畫 */
    .notion-shadow {
      box-shadow: 0 1px 3px rgba(15, 15, 15, 0.04), 0 4px 12px rgba(15, 15, 15, 0.03);
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-morandi-blue/30">

  <!-- 頂部極簡導覽列 -->
  <header class="w-full border-b border-morandi-border bg-white/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-7 h-7 rounded-md bg-morandi-blue text-white flex items-center justify-center text-sm font-bold shadow-sm">
          ✦
        </span>
        <span class="font-semibold tracking-tight text-morandi-text">雲端心電感應</span>
        <span id="headerRoomBadge" class="hidden text-xs font-medium px-2 py-0.5 rounded bg-morandi-bg border border-morandi-border text-morandi-muted">
          房號：<strong id="headerRoomCode" class="text-morandi-text">----</strong>
        </span>
      </div>

      <div class="flex items-center gap-3">
        <!-- 同步狀態指示燈 -->
        <div id="syncIndicator" class="hidden items-center gap-1.5 text-xs text-morandi-muted">
          <span class="w-2 h-2 rounded-full bg-morandi-sage animate-pulse-soft"></span>
          <span>雲端同步中</span>
        </div>

        <!-- 離開房間按鈕 -->
        <button id="leaveRoomBtn" onclick="leaveRoom()" class="hidden text-xs px-2.5 py-1.5 rounded-md border border-morandi-border hover:bg-morandi-bg text-morandi-muted transition">
          切換房間
        </button>

        <!-- 隱藏的房主控制台觸發按鈕 (極低調設計，亦可按 Ctrl+Shift+H 開啟) -->
        <button id="secretHostToggle" onclick="toggleHostConsole()" title="房主控制台 (Ctrl+Shift+H)"
          class="w-7 h-7 rounded-md flex items-center justify-center text-morandi-border hover:text-morandi-muted hover:bg-morandi-bg transition opacity-40 hover:opacity-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-8">

    <!-- ==================== 畫面 1：大廳與房間分流登入 ==================== -->
    <section id="loginView" class="max-w-md mx-auto mt-6">
      <div class="bg-morandi-card border border-morandi-border rounded-xl p-7 notion-shadow">
        <div class="mb-6">
          <div class="inline-block px-2.5 py-1 rounded text-xs font-medium bg-morandi-blue/15 text-morandi-blueDark mb-2">
            Multiplayer Telepathy
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-morandi-text">進入默契測驗室</h1>
          <p class="text-sm text-morandi-muted mt-1">輸入暱稱與房號加入分組，或由房主建立新房間。</p>
        </div>

        <div class="space-y-4">
          <!-- 玩家暱稱 -->
          <div>
            <label class="block text-xs font-semibold text-morandi-muted uppercase tracking-wider mb-1.5">你的暱稱</label>
            <input type="text" id="playerNameInput" maxlength="12" placeholder="例如：小宇、Alex..."
              class="w-full px-3.5 py-2.5 rounded-lg border border-morandi-border bg-morandi-bg/50 focus:bg-white focus:outline-none focus:border-morandi-blue transition text-sm" />
          </div>

          <!-- 房間代碼輸入與建立 -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-morandi-muted uppercase tracking-wider">房間代碼 (分組編號)</label>
              <button type="button" onclick="createNewRoom()" id="createRoomBtn"
                class="text-xs font-medium text-morandi-blueDark hover:underline flex items-center gap-1">
                <span>＋ 我要當房主 (產生新房號)</span>
              </button>
            </div>
            <input type="text" id="roomCodeInput" maxlength="10" placeholder="輸入 4 碼房號，例如：8821"
              class="w-full px-3.5 py-2.5 rounded-lg border border-morandi-border bg-morandi-bg/50 focus:bg-white focus:outline-none focus:border-morandi-blue transition text-sm font-mono uppercase tracking-widest" />
          </div>

          <!-- 登入按鈕 -->
          <button onclick="joinRoom()" id="joinBtn"
            class="w-full mt-2 py-2.5 px-4 rounded-lg bg-morandi-blue hover:bg-morandi-blueDark text-white font-medium text-sm transition shadow-sm flex items-center justify-center gap-2">
            <span>進入房間</span>
          </button>
        </div>

        <div class="mt-6 pt-4 border-t border-morandi-border text-xs text-morandi-muted flex items-center justify-between">
          <span>支援多組同時進行</span>
          <span>資料即時寫入雲端試算表</span>
        </div>
      </div>
    </section>

    <!-- ==================== 畫面 2：遊戲主舞台 ==================== -->
    <section id="gameView" class="hidden space-y-6">

      <!-- 隱藏的房主控制台 (預設收合，點擊右上角微圖示或按 Ctrl+Shift+H 展開) -->
      <div id="hostConsolePanel" class="hidden bg-white border-2 border-morandi-rose/60 rounded-xl p-5 notion-shadow transition-all">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-morandi-border">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 text-xs font-semibold rounded bg-morandi-rose/20 text-morandi-roseDark">房主隱藏控制台</span>
            <span class="text-xs text-morandi-muted">房號：<strong class="font-mono text-morandi-text" id="consoleRoomCode">----</strong>（分享此號碼給組員）</span>
          </div>
          <button onclick="toggleHostConsole()" class="text-xs text-morandi-muted hover:text-morandi-text">收合面板 ✕</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
          <div class="md:col-span-7">
            <label class="block text-xs font-medium text-morandi-muted mb-1">設定本回合題目（送出後全體開始作答）</label>
            <input type="text" id="hostQuestionInput" placeholder="例如：說到「台灣夜市必吃」，第一個想到什麼？"
              class="w-full px-3 py-2 rounded-lg border border-morandi-border bg-morandi-bg/50 focus:bg-white focus:outline-none focus:border-morandi-rose text-sm" />
          </div>
          <div class="md:col-span-5 flex flex-wrap gap-2">
            <button onclick="hostAction('set_question')" id="btnSetQuestion"
              class="flex-1 py-2 px-3 rounded-lg bg-morandi-blue hover:bg-morandi-blueDark text-white text-xs font-medium transition">
              發佈題目
            </button>
            <button onclick="hostAction('reveal')" id="btnReveal"
              class="flex-1 py-2 px-3 rounded-lg bg-morandi-rose hover:bg-morandi-roseDark text-white text-xs font-medium transition shadow-sm">
              全場開牌 ✨
            </button>
            <button onclick="hostAction('reset')" id="btnReset"
              class="py-2 px-3 rounded-lg border border-morandi-border hover:bg-morandi-bg text-morandi-muted text-xs font-medium transition" title="清空題目與答案">
              重置
            </button>
          </div>
        </div>
      </div>

      <!-- 題目展示區 (Notion Callout 區塊風格) -->
      <div class="bg-morandi-card border border-morandi-border rounded-xl p-6 notion-shadow">
        <div class="flex items-center justify-between mb-3">
          <span id="statusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-morandi-sand/30 text-morandi-text">
            等待房主出題中...
          </span>
          <span class="text-xs text-morandi-muted">玩家：<strong id="displayPlayerName" class="text-morandi-text">--</strong></span>
        </div>

        <div class="p-4 rounded-lg bg-morandi-bg border border-morandi-border/80 flex items-start gap-3">
          <span class="text-xl select-none">💭</span>
          <div class="flex-1">
            <div class="text-xs font-medium text-morandi-muted mb-1">本回合默契題目</div>
            <h2 id="questionText" class="text-lg md:text-xl font-bold text-morandi-text leading-snug">
              房主正在構思題目，請稍候...
            </h2>
          </div>
        </div>

        <!-- 玩家作答區 (僅在 playing 狀態顯示) -->
        <div id="answerInputBox" class="hidden mt-5 pt-5 border-t border-morandi-border">
          <label class="block text-xs font-semibold text-morandi-muted uppercase tracking-wider mb-2">寫下你的直覺答案</label>
          <div class="flex flex-col sm:flex-row gap-2.5">
            <input type="text" id="playerAnswerInput" maxlength="30" placeholder="輸入你的答案（送出後仍可修改，直到房主開牌）..."
              class="flex-1 px-4 py-2.5 rounded-lg border border-morandi-border bg-white focus:outline-none focus:border-morandi-sage text-sm" />
            <button onclick="submitPlayerAnswer()" id="submitAnswerBtn"
              class="px-6 py-2.5 rounded-lg bg-morandi-sage hover:bg-morandi-sageDark text-white font-medium text-sm transition shadow-sm whitespace-nowrap">
              送出感應
            </button>
          </div>
          <p id="mySubmittedHint" class="hidden text-xs text-morandi-sageDark mt-2 font-medium">
            ✓ 你已送出答案，等待其他組員完成與房主開牌...
          </p>
        </div>

        <!-- 開牌後的默契統計橫幅 -->
        <div id="telepathyResultBanner" class="hidden mt-5 p-3.5 rounded-lg bg-morandi-sage/15 border border-morandi-sage/40 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-lg">🎉</span>
            <span id="telepathyResultText" class="text-sm font-medium text-morandi-text">開牌完成！</span>
          </div>
          <span id="telepathyMatchRate" class="text-xs font-bold px-2.5 py-1 rounded bg-white text-morandi-sageDark border border-morandi-sage/30">
            默契度計算中
          </span>
        </div>
      </div>

      <!-- 玩家卡牌牆 (全場同步 3D CSS 翻牌) -->
      <div>
        <div class="flex items-center justify-between mb-3 px-1">
          <h3 class="text-xs font-semibold text-morandi-muted uppercase tracking-wider">
            組員感應卡牌 (<span id="playerCount">0</span> 人已作答)
          </h3>
          <span class="text-xs text-morandi-muted">每 2.5 秒自動同步</span>
        </div>

        <!-- 無人作答時的空狀態 -->
        <div id="emptyCardsState" class="bg-white/60 border border-dashed border-morandi-border rounded-xl p-10 text-center">
          <p class="text-sm text-morandi-muted">目前還沒有人送出答案，快來成為第一個感應的人吧！</p>
        </div>

        <!-- 卡牌網格 -->
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- 動態生成 3D 翻牌卡片 -->
        </div>
      </div>

    </section>
  </main>

  <!-- 全域 Toast 提示訊息 -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-morandi-text text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2">
      <span id="toastMsg">提示訊息</span>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 系統設定與 GAS API 串接常數
    // ==========================================
    const SHEET_NAME = 'TelepathyData';
    // 注意：請確保此處為 Google Apps Script 部署後的「網頁應用程式網址 (/exec)」
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwTa6YqCQ_CaGG7NYQ1Ryi4bRD6Tr7KPY2Q9o8JvUDpWjSQvbia4HmOCtmeRcUq2gq-/exec";

    // 全域狀態
    let state = {
      room: "",
      playerName: "",
      isHost: false,
      status: "setup",      // setup | playing | revealed
      question: "",
      answers: {},
      pollingTimer: null,
      isFetching: false
    };

    // ==========================================
    // 2. 初始化與快捷鍵監聽
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      // 檢查網址是否帶有 ?room=XXXX 參數，方便直接分享連結分流
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('roomCodeInput').value = roomParam.toUpperCase();
      }

      // 恢復先前儲存的暱稱
      const savedName = localStorage.getItem('telepathy_player_name');
      if (savedName) {
        document.getElementById('playerNameInput').value = savedName;
      }

      // 鍵盤快捷鍵：Ctrl + Shift + H (或 Cmd + Shift + H) 切換隱藏房主控制台
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'h') {
          e.preventDefault();
          toggleHostConsole();
        }
      });
    });

    // ==========================================
    // 3. 房間分流與登入邏輯
    // ==========================================
    // 房主一鍵產生 4 碼隨機房號並初始化試算表列
    async function createNewRoom() {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput) {
        showToast("請先輸入你的暱稱，再建立房間！");
        document.getElementById('playerNameInput').focus();
        return;
      }

      // 產生 4 碼大寫英數房號 (排除易混淆字元)
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let randomRoom = '';
      for (let i = 0; i < 4; i++) {
        randomRoom += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      document.getElementById('roomCodeInput').value = randomRoom;
      state.isHost = true;
      showToast(`已產生新房號 ${randomRoom}，正在建立雲端房間...`);

      // 呼叫 reset 在後端試算表自動建立該房號的新列 (Row)
      await postToGAS({ room: randomRoom, action: "reset" });
      await joinRoom(true);
    }

    // 進入指定房間
    async function joinRoom(autoOpenHost = false) {
      const name = document.getElementById('playerNameInput').value.trim();
      const room = document.getElementById('roomCodeInput').value.trim().toUpperCase();

      if (!name) {
        showToast("請輸入你的暱稱！");
        return;
      }
      if (!room) {
        showToast("請輸入房間代碼，或點選上方產生新房號！");
        return;
      }

      state.playerName = name;
      state.room = room;
      localStorage.setItem('telepathy_player_name', name);

      // 更新網址參數但不重新整理頁面，方便複製網址分流
      const newUrl = `${window.location.pathname}?room=${encodeURIComponent(room)}`;
      window.history.replaceState({}, '', newUrl);

      // 切換 UI 畫面
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('gameView').classList.remove('hidden');
      document.getElementById('headerRoomBadge').classList.remove('hidden');
      document.getElementById('syncIndicator').classList.remove('hidden');
      document.getElementById('syncIndicator').classList.add('flex');
      document.getElementById('leaveRoomBtn').classList.remove('hidden');

      document.getElementById('headerRoomCode').textContent = room;
      document.getElementById('consoleRoomCode').textContent = room;
      document.getElementById('displayPlayerName').textContent = name;

      if (autoOpenHost || state.isHost) {
        document.getElementById('hostConsolePanel').classList.remove('hidden');
      }

      // 立即抓取一次最新狀態並啟動輪詢 (Polling)
      await fetchRoomState();
      startPolling();
    }

    // 離開目前房間
    function leaveRoom() {
      stopPolling();
      state.room = "";
      state.isHost = false;
      state.answers = {};
      document.getElementById('cardsGrid').innerHTML = '';
      document.getElementById('hostConsolePanel').classList.add('hidden');
      document.getElementById('gameView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('headerRoomBadge').classList.add('hidden');
      document.getElementById('syncIndicator').classList.add('hidden');
      document.getElementById('syncIndicator').classList.remove('flex');
      document.getElementById('leaveRoomBtn').classList.add('hidden');
    }

    // 切換隱藏房主控制台
    function toggleHostConsole() {
      if (!state.room) {
        showToast("請先進入房間後再開啟房主控制台");
        return;
      }
      const panel = document.getElementById('hostConsolePanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        showToast("已開啟隱藏房主控制台");
      }
    }

    // ==========================================
    // 4. API 串接與 setInterval 輪詢 (Polling)
    // ==========================================
    function startPolling() {
      stopPolling();
      // 每 2.5 秒輪詢一次該房間的最新狀態
      state.pollingTimer = setInterval(() => {
        fetchRoomState();
      }, 2500);
    }

    function stopPolling() {
      if (state.pollingTimer) {
        clearInterval(state.pollingTimer);
        state.pollingTimer = null;
      }
    }

    // GET: 根據 ?room= 抓取對應房間狀態
    async function fetchRoomState() {
      if (!state.room || state.isFetching) return;
      state.isFetching = true;

      try {
        const url = `${GAS_API_URL}?room=${encodeURIComponent(state.room)}&t=${Date.now()}`;
        const response = await fetch(url);
        const data = await response.json();

        renderGameState(data);
      } catch (error) {
        console.error("輪詢資料失敗:", error);
      } finally {
        state.isFetching = false;
      }
    }

    // POST: 傳送動作至 GAS 後端
    async function postToGAS(payload) {
      try {
        // 使用 text/plain 避免 GAS CORS 預檢 (Preflight OPTIONS) 阻擋
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error("寫入 GAS 失敗:", error);
        showToast("網路連線異常，請稍後再試");
        return { success: false };
      }
    }

    // ==========================================
    // 5. 遊戲互動操作 (房主與玩家)
    // ==========================================
    async function hostAction(actionType) {
      if (!state.room) return;

      if (actionType === 'set_question') {
        const q = document.getElementById('hostQuestionInput').value.trim();
        if (!q) {
          showToast("請先輸入題目內容！");
          return;
        }
        showToast("正在發佈新題目...");
        await postToGAS({
          room: state.room,
          action: "set_question",
          question: q
        });
        document.getElementById('playerAnswerInput').value = "";
        await fetchRoomState();
        showToast("題目已發佈！組員可以開始作答了");

      } else if (actionType === 'reveal') {
        if (Object.keys(state.answers).length === 0) {
          showToast("目前還沒有人作答喔！");
          return;
        }
        showToast("正在觸發全場同步開牌...");
        await postToGAS({
          room: state.room,
          action: "reveal"
        });
        await fetchRoomState();

      } else if (actionType === 'reset') {
        showToast("正在重置房間狀態...");
        await postToGAS({
          room: state.room,
          action: "reset"
        });
        document.getElementById('hostQuestionInput').value = "";
        document.getElementById('playerAnswerInput').value = "";
        await fetchRoomState();
        showToast("已重置為等待出題狀態");
      }
    }

    async function submitPlayerAnswer() {
      const ans = document.getElementById('playerAnswerInput').value.trim();
      if (!ans) {
        showToast("請輸入你的答案再送出！");
        return;
      }

      const btn = document.getElementById('submitAnswerBtn');
      btn.disabled = true;
      btn.textContent = "傳送中...";

      await postToGAS({
        room: state.room,
        action: "submit_answer",
        playerName: state.playerName,
        answer: ans
      });

      btn.disabled = false;
      btn.textContent = "更新答案";
      document.getElementById('mySubmittedHint').classList.remove('hidden');
      showToast("感應答案已送出！");
      await fetchRoomState();
    }

    // ==========================================
    // 6. 畫面渲染與 3D 翻牌同步引擎
    // ==========================================
    function renderGameState(data) {
      const prevStatus = state.status;
      state.status = data.status || "setup";
      state.question = data.question || "";
      state.answers = data.answers || {};

      const statusBadge = document.getElementById('statusBadge');
      const questionText = document.getElementById('questionText');
      const answerInputBox = document.getElementById('answerInputBox');
      const resultBanner = document.getElementById('telepathyResultBanner');
      const myHint = document.getElementById('mySubmittedHint');

      // 1. 更新狀態標籤與題目區塊
      if (state.status === "setup") {
        statusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-morandi-sand/30 text-morandi-text";
        statusBadge.innerHTML = "⏳ 等待房主出題中";
        questionText.textContent = "房主正在構思題目，請稍候...";
        questionText.classList.add('text-morandi-muted');
        answerInputBox.classList.add('hidden');
        resultBanner.classList.add('hidden');
        myHint.classList.add('hidden');
        document.getElementById('submitAnswerBtn').textContent = "送出感應";

      } else if (state.status === "playing") {
        statusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-morandi-blue/20 text-morandi-blueDark";
        statusBadge.innerHTML = "✍️ 心電感應作答中";
        questionText.textContent = state.question;
        questionText.classList.remove('text-morandi-muted');
        answerInputBox.classList.remove('hidden');
        resultBanner.classList.add('hidden');

        // 如果自己已經在名單內，顯示已送出提示
        if (state.answers[state.playerName]) {
          myHint.classList.remove('hidden');
          document.getElementById('submitAnswerBtn').textContent = "更新答案";
        } else {
          myHint.classList.add('hidden');
          document.getElementById('submitAnswerBtn').textContent = "送出感應";
        }

      } else if (state.status === "revealed") {
        statusBadge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-morandi-rose/20 text-morandi-roseDark";
        statusBadge.innerHTML = "✨ 全場開牌揭曉";
        questionText.textContent = state.question;
        questionText.classList.remove('text-morandi-muted');
        answerInputBox.classList.add('hidden');
        resultBanner.classList.remove('hidden');
        calculateTelepathyScore(state.answers);
      }

      // 2. 渲染玩家 3D 卡牌牆
      renderCards(state.answers, state.status === "revealed", prevStatus !== "revealed" && state.status === "revealed");
    }

    function renderCards(answersObj, isRevealed, justRevealed) {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyCardsState');
      const players = Object.keys(answersObj);

      document.getElementById('playerCount').textContent = players.length;

      if (players.length === 0) {
        emptyState.classList.remove('hidden');
        grid.innerHTML = '';
        return;
      }

      emptyState.classList.add('hidden');

      // 比對現有 DOM 卡片，避免輪詢時整塊重繪導致 3D 翻牌動畫閃爍中斷
      const existingCards = Array.from(grid.children);
      const existingNames = existingCards.map(el => el.dataset.player);

      // 若玩家列表變動（例如重置或新玩家加入），重建卡片骨架
      if (existingNames.join(',') !== players.join(',')) {
        grid.innerHTML = players.map((player, idx) => {
          const isMe = player === state.playerName;
          return `
            <div data-player="${escapeHtml(player)}" class="flip-card perspective-1000 h-40 select-none">
              <div class="flip-card-inner">
                <!-- 卡背：未開牌狀態 (莫蘭迪霧霾藍) -->
                <div class="flip-card-front bg-morandi-blue text-white border border-morandi-blueDark/20 notion-shadow">
                  <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-sm font-bold mb-2">
                    ${escapeHtml(player.charAt(0).toUpperCase())}
                  </div>
                  <div class="font-semibold text-sm truncate max-w-full px-2">
                    ${escapeHtml(player)} ${isMe ? '<span class="text-[10px] bg-white/25 px-1.5 py-0.5 rounded ml-0.5">你</span>' : ''}
                  </div>
                  <div class="text-[11px] text-white/80 mt-1.5 flex items-center gap-1">
                    <span>✦ 已鎖定感應</span>
                  </div>
                </div>

                <!-- 卡面：開牌後顯示答案 (Notion 極簡白卡) -->
                <div class="flip-card-back bg-white border-2 ${isMe ? 'border-morandi-sage' : 'border-morandi-border'} notion-shadow">
                  <span class="text-[11px] font-medium text-morandi-muted mb-1 truncate max-w-full">
                    ${escapeHtml(player)}
                  </span>
                  <div class="card-answer-text text-base md:text-lg font-bold text-morandi-text break-words line-clamp-3">
                    ${escapeHtml(answersObj[player])}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // 更新每張卡片的答案文字與 3D 翻轉狀態
      Array.from(grid.children).forEach((cardEl, index) => {
        const player = cardEl.dataset.player;
        const ansTextEl = cardEl.querySelector('.card-answer-text');
        if (ansTextEl) {
          ansTextEl.textContent = answersObj[player] || "";
        }

        if (isRevealed) {
          // 若剛觸發開牌，加入微幅階梯延遲 (Stagger) 讓全場翻牌更有儀式感
          if (justRevealed) {
            setTimeout(() => {
              cardEl.classList.add('is-flipped');
            }, index * 120);
          } else {
            cardEl.classList.add('is-flipped');
          }
        } else {
          cardEl.classList.remove('is-flipped');
        }
      });
    }

    // 計算全場默契一致率（忽略大小寫與前後空白）
    function calculateTelepathyScore(answersObj) {
      const values = Object.values(answersObj).map(v => v.trim().toLowerCase()).filter(Boolean);
      const resultText = document.getElementById('telepathyResultText');
      const matchBadge = document.getElementById('telepathyMatchRate');

      if (values.length <= 1) {
        resultText.textContent = "開牌完成！快看看大家的答案吧";
        matchBadge.textContent = `${values.length} 人參與`;
        return;
      }

      const freq = {};
      let maxCount = 0;
      let topAnswer = "";

      values.forEach(val => {
        freq[val] = (freq[val] || 0) + 1;
        if (freq[val] > maxCount) {
          maxCount = freq[val];
          topAnswer = val;
        }
      });

      const rate = Math.round((maxCount / values.length) * 100);
      matchBadge.textContent = `最高默契度 ${rate}%`;

      if (rate === 100) {
        resultText.textContent = `奇蹟！全員心電感應大成功（一致回答「${topAnswer}」）！`;
      } else if (maxCount > 1) {
        resultText.textContent = `共有 ${maxCount} 位組員默契一致，都想到了「${topAnswer}」！`;
      } else {
        resultText.textContent = "大家的腦洞都太獨特啦，完全沒有重複的答案！";
      }
    }

    // ==========================================
    // 7. 工具函式
    // ==========================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2800);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
